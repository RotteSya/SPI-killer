name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Node
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
        env:
          OFFICIAL_PROVIDER: mock
      - name: Isolated local-server smoke
        run: ../scripts/dev.sh --smoke
        env:
          HOST: 0.0.0.0
          OFFICIAL_PROVIDER: anthropic
          ANTHROPIC_API_KEY: poison-model-key
          POSTGRES_URL: postgres://poison:poison@127.0.0.1:1/production
          PAYMENT_PROVIDER: stripe
          STRIPE_SECRET_KEY: poison-stripe-key
          STRIPE_WEBHOOK_SECRET: poison-webhook-key
          VERCEL: '1'
          NSPI_QA_EPHEMERAL: '0'
          PORT: '18787'

  postgres:
    name: Postgres store
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: notchspi
          POSTGRES_PASSWORD: notchspi
          POSTGRES_DB: notchspi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          OFFICIAL_PROVIDER: mock
          TEST_POSTGRES_URL: postgres://notchspi:notchspi@localhost:5432/notchspi_test?sslmode=disable

  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: node scripts/repo-health.mjs
      - name: Swift toolchain
        run: swift --version
      - name: Swift tests (serial, warnings-as-errors)
        run: swift test -Xswiftc -warnings-as-errors
      - name: Release arm64 build
        run: swift build -c release --arch arm64
        env:
          OFFICIAL_PROVIDER: mock
