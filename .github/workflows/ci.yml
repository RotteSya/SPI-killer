name: CI

on:
  push:
    branches: [main, codex/product-update-2-12]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18.0', '24.20.0']
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --include=optional
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: node --test --test-reporter=tap --test-concurrency=2 'test/*.test.ts' | tee "$RUNNER_TEMP/node-tests.tap"
        env:
          OFFICIAL_PROVIDER: mock
      - name: Isolated local-server smoke
        run: ../scripts/dev.sh --smoke
        env:
          HOST: 0.0.0.0
          OFFICIAL_PROVIDER: anthropic
          ANTHROPIC_API_KEY: poison-model-key
          POSTGRES_URL: postgres://poison:poison@127.0.0.1:1/production
          PAYMENT_PROVIDER: stripe
          STRIPE_SECRET_KEY: poison-stripe-key
          STRIPE_WEBHOOK_SECRET: poison-webhook-key
          VERCEL: '1'
          NSPI_QA_EPHEMERAL: '0'
          PORT: '18787'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-${{ matrix.node }}-tests
          path: ${{ runner.temp }}/node-tests.tap
          if-no-files-found: ignore

  postgres:
    name: Postgres ${{ matrix.postgres }} / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18.0', '24.20.0']
        postgres: ['16', '17']
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: notchspi
          POSTGRES_PASSWORD: notchspi
          POSTGRES_DB: notchspi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --include=optional
      - run: node --test --test-reporter=tap --test-concurrency=2 'test/*.test.ts' | tee "$RUNNER_TEMP/postgres-tests.tap"
        env:
          OFFICIAL_PROVIDER: mock
          TEST_POSTGRES_URL: postgres://notchspi:notchspi@localhost:5432/notchspi_test?sslmode=disable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-${{ matrix.postgres }}-node-${{ matrix.node }}-tests
          path: ${{ runner.temp }}/postgres-tests.tap
          if-no-files-found: ignore

  linux-native:
    name: Node 24 / AL2023 native resources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NSPI_NODE_IMAGE: public.ecr.aws/lambda/nodejs@sha256:ba8267e65e24c53ab13256b11bd004a01e23c4ec7f0d5301522a57fba6868b63
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install target Linux native dependencies
        run: >-
          docker run --rm --entrypoint npm
          -v "$GITHUB_WORKSPACE:/work" -w /work/server
          "$NSPI_NODE_IMAGE" ci --include=optional --no-audit --no-fund
      - name: Verify 1 GiB native decoder bounds without network
        run: >-
          docker run --rm --network none --memory 1024m --memory-swap 1024m
          --cpus 1 --pids-limit 256 --entrypoint node
          -v "$GITHUB_WORKSPACE:/work:ro" -w /work
          "$NSPI_NODE_IMAGE" scripts/verify-linux-runtime.mjs
          > "$RUNNER_TEMP/linux-native-resource.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-native-resource
          path: ${{ runner.temp }}/linux-native-resource.json
          if-no-files-found: ignore

  vercel-bundle:
    name: Node 24 / Vercel Linux function bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NSPI_NODE_IMAGE: public.ecr.aws/lambda/nodejs@sha256:ba8267e65e24c53ab13256b11bd004a01e23c4ec7f0d5301522a57fba6868b63
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Cache the verified public project settings without credentials
        # Read from the project's API on 2026-09-07. Deployment settings and secrets
        # still require a fresh production check; this job only builds locally.
        run: |
          mkdir -p .vercel "$RUNNER_TEMP/nspi-vercel"
          cat > .vercel/project.json <<'JSON'
          {
            "projectId": "prj_w2DZOa9GeyLV1K2yaRtOr4TS82ib",
            "orgId": "team_DD9AF4JMSeYki6LwJ5HPX6Oa",
            "projectName": "notchspi-api",
            "settings": {
              "createdAt": 1783726557685,
              "framework": "fastify",
              "devCommand": null,
              "installCommand": null,
              "buildCommand": null,
              "outputDirectory": null,
              "rootDirectory": "server",
              "directoryListing": false,
              "nodeVersion": "24.x"
            }
          }
          JSON
      - name: Install the pinned Vercel CLI on AL2023
        run: >-
          docker run --rm --entrypoint npm
          -v "$RUNNER_TEMP/nspi-vercel:/toolchain" -w /toolchain
          "$NSPI_NODE_IMAGE" install --save-exact --include=optional --no-audit --no-fund vercel@59.11.7
      - name: Build the actual function without deployment credentials
        run: >-
          docker run --rm --entrypoint node
          -e CI=1 -e VERCEL_TELEMETRY_DISABLED=1 -e NO_COLOR=1
          -v "$GITHUB_WORKSPACE:/work" -v "$RUNNER_TEMP/nspi-vercel:/toolchain:ro" -w /work
          "$NSPI_NODE_IMAGE" /toolchain/node_modules/vercel/dist/index.js
          build --standalone --non-interactive --local-config /work/server/vercel.json --global-config /tmp/vercel-auth
          2>&1 | tee "$RUNNER_TEMP/vercel-build.log"
      - name: Inspect and exercise the packaged function without external network
        run: >-
          docker run --rm --network none --memory 1024m --memory-swap 1024m
          --cpus 1 --pids-limit 256 --entrypoint node
          -v "$GITHUB_WORKSPACE:/work:ro" -w /work
          "$NSPI_NODE_IMAGE" scripts/verify-vercel-output.mjs .vercel/output
          > "$RUNNER_TEMP/vercel-bundle.json"
      - name: Archive the validated standalone build output
        run: >-
          tar -C .vercel/output -czf "$RUNNER_TEMP/vercel-function-node24-linux-x64.tar.gz"
          config.json functions static
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vercel-linux-bundle
          path: |
            ${{ runner.temp }}/vercel-build.log
            ${{ runner.temp }}/vercel-bundle.json
            ${{ runner.temp }}/vercel-function-node24-linux-x64.tar.gz
          if-no-files-found: ignore

  macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 20
    env:
      NSPI_QA_EPHEMERAL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: node scripts/repo-health.mjs
      - name: Swift toolchain
        run: swift --version
      - name: Swift tests (serial, warnings-as-errors)
        run: swift test -Xswiftc -warnings-as-errors
      - name: Release arm64 build
        run: swift build -c release --arch arm64
        env:
          OFFICIAL_PROVIDER: mock
